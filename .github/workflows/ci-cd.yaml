name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/BriceSop/disease-classification

jobs:

  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: meta
        run: |
          TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG
          echo "version=$TAG" >> $GITHUB_OUTPUT

  lint-and-tests:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Lint code
        run: ruff check .

      - name: Run tests
        run: pytest

  preprocess:
    needs: lint-and-tests
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Preprocessing's execution
        run: python src/prepare.py

  train:
    needs: preprocess
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Model training
        run: python src/training.py

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Model training
        run: python src/evaluate.py
  