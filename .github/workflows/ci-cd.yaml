name: CI/CD pipeline

on:
  push:
    branches: [main]

jobs:

  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: meta
        run: |
          TAG=${{ github.sha }}
          docker build -t ghcr.io/bricesop/disease-classification:$TAG .
          docker push ghcr.io/bricesop/disease-classification:$TAG
          echo "version=$TAG" >> $GITHUB_OUTPUT

  lint-and-tests:
    needs: 
      - build-and-push-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Lint code
        run: ruff check .

      - name: Run tests
        run: pytest

  preprocess:
    needs: 
      - build-and-push-image
      - lint-and-tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Pull data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull -r origin
      
      - name: Preprocessing's execution
        run: python src/prepare.py

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data
          path: | 
            data/processed
            data/interim

  train:
    needs: 
      - build-and-push-image
      - preprocess
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download training data
        uses: actions/download-artifact@v4
        with:
          name: pipeline-data
          path: data
            
      - name: Model training
        run: python src/training.py

      - name: Upload model's artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-joblib
          path: models    

  evaluate:
    needs: 
      - build-and-push-image
      - train
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/BriceSop/CI-CD-Implementation-for-disease-classification-task.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Download evaluation data
        uses: actions/download-artifact@v4
        with:
          name: pipeline-data
          path: data
      
      - name: Download model's artifact
        uses: actions/download-artifact@v4
        with:
          name: model-joblib
          path: models

      - name: Model evaluation
        run: python src/evaluate.py
  
  deploy:
    needs: 
      - build-and-push-image
      - evaluate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: pipeline-data
          path: data
      
      - name: Download model's artifact
        uses: actions/download-artifact@v4
        with:
          name: model-joblib
          path: models
      
      - name: Model prediction
        run: python src/prediction.py

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install -i /usr/local/aws-cli -b /usr/local/bin
          aws --version

      - name: Setup AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      
      - name: Sync files to S3 bucket
        run: |
          aws s3 sync data/preds s3://project-disease-classif --delete