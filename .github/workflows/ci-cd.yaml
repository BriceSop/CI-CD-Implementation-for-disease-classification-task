name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:

  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: meta
        run: |
          TAG=${{ github.sha }}
          docker build -t ghcr.io/bricesop/disease-classification:$TAG .
          docker push ghcr.io/bricesop/disease-classification:$TAG
          echo "version=$TAG" >> $GITHUB_OUTPUT

  lint-and-tests:
    needs: 
      - build-and-push-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Lint code
        run: ruff check .

      - name: Run tests
        run: pytest

  preprocess:
    needs: 
      - build-and-push-image
      - lint-and-tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Preprocessing's execution
        run: python src/prepare.py

  train:
    needs: 
      - build-and-push-image
      - preprocess
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Model training
        run: python src/training.py

  evaluate:
    needs: 
      - build-and-push-image
      - train
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bricesop/disease-classification:${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Model training
        run: python src/evaluate.py
  