[project]
name = "disease_classification"
version = "0.0.1"
description = "Classification model for Primary Biliary Cirrhosis disease status, in a CI/CD way"
authors = [
  { name = "Brice Sop" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "catboost>=1.2.8",
    "dagshub>=0.6.4",
    "ipython",
    "jupyterlab",
    "matplotlib",
    "mlflow>=3.8.0",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "pytest-sugar>=1.1.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["disease_classification"]
include = ["pyproject.toml", "disease_classification/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["disease_classification"]
force-sort-within-sections = true

